name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test --no-pub 2>&1 | tee test.log

      - name: Report Test Failure to Commit Comments
        if: failure()
        run: |
          echo "Extracting test failure logs..."
          TEST_ERR=$(tail -n 60 test.log 2>/dev/null || echo "No test.log found")
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            --field body="### 🚨 Test Failure Diagnostics

          \`\`\`
          $TEST_ERR
          \`\`\`" || true
