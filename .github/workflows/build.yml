name: Build & Release Music App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          java -version

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          elif [ -f android/app/release.jks ]; then
            echo "Using repository bundled release.jks..."
          else
            echo "ERROR: Neither secret KEYSTORE_BASE64 nor android/app/release.jks exists!"
            exit 1
          fi
          echo "Keystore file ready: $(ls -lh android/app/release.jks)"

      - name: Create key.properties for Gradle
        run: |
          cat > android/key.properties << EOF
          storePassword=musicapp123
          keyPassword=musicapp123
          keyAlias=musicappkey
          storeFile=release.jks
          EOF

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: |
          set -o pipefail
          echo "Running Full Unit Test Suite..."
          flutter test --no-pub 2>&1 | tee build.log

      - name: Analyze Project Code
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          BUILD_NUM="${{ github.run_number }}"
          FULL_VERSION="1.0.${BUILD_NUM}"
          echo "APP_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "Building version ${FULL_VERSION} (code: ${BUILD_NUM})"

      - name: Build Android Release APK
        run: |
          echo "Building Android Release APK via Flutter..."
          EXTRA_FLAGS=""
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            EXTRA_FLAGS="--dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"
          fi
          flutter build apk --release --android-skip-build-dependency-validation \
            --build-name=${{ env.APP_VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            $EXTRA_FLAGS 2>&1 | tee build.log
          
          FINAL_APK=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -z "$FINAL_APK" ]; then
            echo "FATAL: Release APK was not generated."
            find . -name "*.apk" -type f
            exit 1
          fi
          echo "Release APK successfully generated at: $FINAL_APK"

      - name: Report Build Error to Commit Comments
        if: failure()
        run: |
          echo "Extracting failure logs..."
          BUILD_ERR=$(tail -n 80 build.log 2>/dev/null || echo "No build.log found")
          GRADLE_ERR=$(tail -n 80 android/gradle.log 2>/dev/null || echo "No gradle.log found")
          
          # Create escaped JSON payload
          PAYLOAD=$(jq -n --arg b "$BUILD_ERR" --arg g "$GRADLE_ERR" '{body: ("### 🚨 Build Failure Diagnostics\n\n#### Flutter Build Tail:\n```\n" + $b + "\n```\n\n#### Gradle AssembleRelease Tail:\n```\n" + $g + "\n```")}')
          
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -d "$PAYLOAD" || true

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          APK_PATH=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found anywhere in workspace!"
            find . -name "*.apk" -type f
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-output/swarva-v${{ env.APP_VERSION }}.apk
          cp "$APK_PATH" release-output/swarva-release.apk
          cp "$APK_PATH" release-output/music-app-v${{ env.APP_VERSION }}.apk
          cp "$APK_PATH" release-output/music-app-release.apk
          (cd release-output && sha256sum swarva-v${{ env.APP_VERSION }}.apk swarva-release.apk music-app-v${{ env.APP_VERSION }}.apk music-app-release.apk > checksums.sha256)
          ls -lh release-output/
          cat release-output/checksums.sha256

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swarva-release-apk
          path: release-output/swarva-release.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Swarva v${{ env.APP_VERSION }}"
          body: |
            ### ✨ Swarva v${{ env.APP_VERSION }}

            **What's new in this release:**
            - 🎨 **Official Brand & Identity — Swarva:** Rebranded launcher label, Android 13+ monochrome theming, and AndroidX adaptive icons with safe-zone ribbon isolation.
            - 🌟 **Smooth Swarva Splash Screen:** Custom animated multi-layered S-ribbon entrance (scale 90% → 100%, 500ms) with clean off-white brand typography, zero color jump, and native handoff.
            - 💎 **Liquid Glassmorphic UI Redesign:** Pure frosted glass effects, subtle reflections, ambient diagonal light beams, and glowing active states.
            - ⚡ **Jump Back In Overhaul:** Capped quick-pick grid to 6 tiles (2 columns x 3 rows), saving ~160dp of vertical space with YouTube title sanitization.
            - 🎵 **Spotify-Style Now Playing Screen:** Full 10-section streaming player with dynamic color palette, synced lyrics card, sticky mini header, and artist exploration.
            - ⏱️ **Integrated Sleep Timer:** Direct sleep timer controls (15, 30, 45, 60 mins) with auto-pause.
            - 🚀 **Instant Home Streaming:** Skeleton placeholders and progressive section rendering stream content in without layout shifts.
            - 🎙️ **Podcast Audio Playback:** Restored full podcast stream resolution and playback across all feeds.
            - 🎵 **Ad-Free Streaming Engine:** Blazing-fast 320kbps streams with native background playback.

            #### 📲 How to Install:
            1. Download **`swarva-release.apk`** below
            2. On your Android phone: **Settings → Security → Unknown Sources → Allow**
            3. Open the downloaded APK and tap **Install**
            4. Future updates will be delivered **inside the app automatically**!

            > ⚠️ You may need to allow "Install from Unknown Sources" for this app in Android settings.
          draft: false
          prerelease: false
          update_existing_release: true
          files: |
            release-output/swarva-v${{ env.APP_VERSION }}.apk
            release-output/swarva-release.apk
            release-output/music-app-v${{ env.APP_VERSION }}.apk
            release-output/music-app-release.apk
            release-output/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
