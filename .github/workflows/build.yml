name: Build & Release Music App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Version is ${VERSION}"

      - name: Build Android Release APK
        run: |
          flutter build apk --release

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/music-app-v${{ env.APP_VERSION }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/music-app-release.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-release-apk
          path: release-output/music-app-release.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Music App v${{ env.APP_VERSION }}"
          body: |
            ### 🎵 Music App v${{ env.APP_VERSION }}
            
            - **Ad-Free Zero-Delay Streaming Engine** (JioSaavn 320kbps DES-ECB + YouTube audio-only stream extraction)
            - **Universal UI Design System: Twilight Calm**
            - **Native Background & Lock-Screen Media Controls**
            - **Local Disk Caching & 0ms Offline Playback Vault**
            - **In-App Auto-Update System** (seamless in-place updates without uninstalling)

            #### Direct Download:
            Download **`music-app-release.apk`** below and install directly on your Android phone.
          draft: false
          prerelease: false
          files: |
            release-output/music-app-v${{ env.APP_VERSION }}.apk
            release-output/music-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
