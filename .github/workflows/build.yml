name: Build & Release Music App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          java -version

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          elif [ -f android/app/release.jks ]; then
            echo "Using repository bundled release.jks..."
          else
            echo "ERROR: Neither secret KEYSTORE_BASE64 nor android/app/release.jks exists!"
            exit 1
          fi
          echo "Keystore file ready: $(ls -lh android/app/release.jks)"

      - name: Create key.properties for Gradle
        run: |
          cat > android/key.properties << EOF
          storePassword=musicapp123
          keyPassword=musicapp123
          keyAlias=musicappkey
          storeFile=release.jks
          EOF

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version ${VERSION}"

      - name: Build Android Release APK
        run: |
          echo "Building Android Release APK via Flutter..."
          flutter build apk --release --verbose || {
            echo "::error::Flutter build failed. Printing last 300 lines of Gradle log:"
            cd android && ./gradlew app:assembleRelease --stacktrace --info
            exit 1
          }

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          APK_PATH=$(find build -name "*.apk" -type f | grep "release" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching all built APKs..."
            APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-output/music-app-v${{ env.APP_VERSION }}.apk
          cp "$APK_PATH" release-output/music-app-release.apk
          ls -lh release-output/

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-release-apk
          path: release-output/music-app-release.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Music App v${{ env.APP_VERSION }}"
          body: |
            ### 🎵 Music App v${{ env.APP_VERSION }}

            **What's included:**
            - 🚫 Ad-Free Zero-Delay Streaming Engine (JioSaavn 320kbps + YouTube audio-only extraction)
            - 🌙 Universal UI: Twilight Calm Design System
            - 🎵 Native Background & Lock-Screen Media Controls
            - 💾 Local Disk Cache & 0ms Offline Playback Vault
            - 🔄 In-App Auto-Update System (seamless in-place updates)

            #### 📲 How to Install:
            1. Download **`music-app-release.apk`** below
            2. On your Android phone: **Settings → Security → Unknown Sources → Allow**
            3. Open the downloaded APK and tap **Install**
            4. Future updates will be delivered **inside the app automatically**!

            > ⚠️ You may need to allow "Install from Unknown Sources" for this app in Android settings.
          draft: false
          prerelease: false
          update_existing_release: true
          files: |
            release-output/music-app-v${{ env.APP_VERSION }}.apk
            release-output/music-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
