name: music_app
description: "A high-performance personal music player in Flutter with zero-delay streaming, background playback, and the Twilight Calm design system."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Audio Playback & Background Media Service
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_video_progress_bar: ^2.0.3

  # Audio Stream Extraction & HTTP
  youtube_explode_dart: ^2.2.1
  http: ^1.2.2
  path_provider: ^2.1.4

  # UI, Fonts & Network Assets
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

  # Supabase Backend & Authentication
  supabase_flutter: ^2.8.0

  # Firebase Core & Cloud Messaging (Push Notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#182838"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#182838"
  image: "assets/icon/splash_icon.png"
  android_12:
    color: "#182838"
    image: "assets/icon/splash_icon.png"
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
