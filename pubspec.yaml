name: music_app
description: "A modern Flutter music player app supporting local playback and online streaming."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Audio Playback & Background Service
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_video_progress_bar: ^2.0.3

  # Local Audio Query & Storage Permissions
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1

  # UI & Networking
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
